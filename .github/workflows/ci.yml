name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/url_shortener?schema=public
      REDIS_URL: redis://localhost:6379
      SAFE_BROWSING_ENABLED: "false"
      PORT: "5000"
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX_REQUESTS: "100"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: url_shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d url_shortener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Build backend
        run: npm run build

      - name: Start backend
        shell: bash
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Verify backend health
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not become healthy"
          cat /tmp/backend.log
          exit 1

      - name: Show backend logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/backend.log ]; then
            cat /tmp/backend.log
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/url-shortner

    env:
      VITE_API_BASE_URL: /api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/url-shortner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        env:
          SAFE_BROWSING_ENABLED: "false"
          GOOGLE_SAFE_BROWSING_API_KEY: ""
          VITE_API_BASE_URL: /api
        run: docker compose build